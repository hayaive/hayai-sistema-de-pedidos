  const lineas = d.lineas.map(l =>
    "<tr><td colspan=\"2\">" + esc(nombreDe(l)) + "</td></tr>" +
    '<tr><td>&nbsp;&nbsp;' + l.cant + " x " + num(precioDe(l)) + '</td><td class="d">' + num(l.cant * precioDe(l)) + "</td></tr>").join("");
  return '<div class="ticket">' +
    '<div class="ticket__c"><span class="ticket__marca">' + esc(D.negocio.nombre) + "</span></div>" +
    '<div class="ticket__c">' + esc(D.negocio.rif) + "<br>" + esc(D.negocio.direccion) + "</div><hr>" +
    "<div>TICKET " + String(d.id).padStart(5, "0") + "<br>" +
      fechaHora(d.hora) + "<br>" +
      "Cajero: " + esc((D.usuario ? D.usuario.nombre : "").split(" ")[0]) + "<br>" +
      "Cliente: " + esc(d.cliente) + "</div><hr>" +
    "<table>" + lineas + "</table><hr>" +
    "<table>" +
      '<tr class="tot"><td>TOTAL Bs</td><td class="d">' + num(d.total) + "</td></tr>" +
      "<tr><td>" + esc(d.pago) + '</td><td class="d">' + num(d.total) + "</td></tr>" +
    "</table><hr>" +
    '<div class="ticket__c">Tasa aplicada ' + num(d.tasa) + "<br>Equivale a " + signo(d.tasaTipo) + " " + num(d.total / d.tasa) + "</div>" +
    (d.anulado ? '<hr><div class="ticket__c"><b>*** DOCUMENTO ANULADO ***</b></div>' : "") +
    '<p class="ticket__pie">Gracias por su compra<br>Los encargos se retiran con este ticket<br><br>Sistema hecho por HAYAI</p>' +
    "</div>";
}

/* ── Pedidos ───────────────────────────────────────────────────── */
const ESTADOS = {
  por_cobrar: { et:"Por cobrar", chip:"chip--sol" },
  cobrado:    { et:"Cobrado",    chip:"chip--verde" },
  entregado:  { et:"Entregado",  chip:"chip--verde" },
  anulado:    { et:"Anulado",    chip:"chip--rojo" }
};

function pedidosFiltrados(){
  const q = D.q.pedidos.trim().toLowerCase();
  const qc = limpiarCedula(D.q.pedidos);
  return D.pedidos.filter(p => {
    if(D.filtro.pedidos !== "todos" && p.estado !== D.filtro.pedidos) return false;
    if(!q) return true;
    const c = cliente(p.clienteId);
    if(String(p.id).includes(q)) return true;
    if(c && c.nombre.toLowerCase().includes(q)) return true;
    if(c && qc && limpiarCedula(c.cedula).includes(qc)) return true;
    return false;
  }).sort((a, b) => a.retiro - b.retiro);
}

function vistaPedidos(){
  const lista = pedidosFiltrados();
  const abierto = D.pedidos.find(p => p.id === D.pedidoAbierto) || null;

  const filtros = [["todos","Todos"],["por_cobrar","Por cobrar"],["cobrado","Cobrados"],["entregado","Entregados"]]
    .map(f => '<button class="btn btn--contorno' + (D.filtro.pedidos === f[0] ? " es-activo" : "") +
      '" data-a="filtroPedidos" data-v="' + f[0] + '">' + f[1] + "</button>").join("");

  const tabla = lista.length
    ? '<div class="tabla-env"><table class="tabla tabla--densa"><thead><tr>' +
        "<th>Pedido</th><th>Cliente</th><th>Se retira</th><th>Estado</th><th class=\"num\">Saldo</th></tr></thead><tbody>" +
      lista.map(p => {
        const c = cliente(p.clienteId), s = saldoPedido(p);
        return '<tr class="pulsable' + (p.id === D.pedidoAbierto ? " es-sel" : "") + '" data-a="verPedido" data-id="' + p.id + '">' +
          '<td class="cifra cifra--sm">' + p.id + "</td>" +
          '<td><span class="recorte">' + esc(c ? c.nombre : "Sin cliente") + "</span></td>" +
          '<td class="min tenue">' + fechaHora(p.retiro) + "</td>" +
          '<td><span class="chip ' + ESTADOS[p.estado].chip + ' chip--xs">' + ESTADOS[p.estado].et + "</span></td>" +
          '<td class="num' + (s ? "" : " tenue") + '">' + (p.estado === "anulado" ? "—" : num(s)) + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="nota-pie aviso-scroll" style="gap:.4rem;align-items:center">' + ic("info","ic--sm") +
      "Esta tabla se desliza de lado con el dedo: las cinco columnas se leen juntas.</p>"
    : (D.q.pedidos || D.filtro.pedidos !== "todos"
        ? '<div class="vacio vacio--filtro"><span class="vacio__ic">' + ic("buscar","ic--lg") + "</span>" +
          "<h4>Ningún pedido coincide</h4><p>Hay " + plural(D.pedidos.length, "pedido", "pedidos") +
          " en total. Quita lo que escribiste o vuelve a «Todos» para verlos.</p>" +
          '<button class="btn btn--contorno" data-a="limpiarPedidos">Quitar el filtro</button></div>'
        : '<div class="vacio"><span class="vacio__ic">' + ic("tabla","ic--lg") + "</span>" +
          "<h4>Todavía no hay pedidos</h4><p>Aquí se guarda lo que la gente encarga y no se lleva en el momento.</p>" +
          '<button class="btn btn--sol" data-a="montar">' + ic("mas") + "Montar el primer pedido</button></div>");

  return '<div class="fila" data-tour="buscador">' +
      '<div class="grupo-ent" style="max-width:19rem"><span class="grupo-ent__ic izq">' + ic("buscar") + "</span>" +
      '<input class="ent tiene-izq" id="q-pedidos" data-in="pedidos" value="' + esc(D.q.pedidos) +
        '" placeholder="Número, nombre o cédula" autocomplete="off"></div>' +
      '<div class="btn-grupo">' + filtros + "</div>" +
      '<span class="min tenue" style="margin-left:auto">' + plural(lista.length, "pedido", "pedidos") + "</span></div>" +
    '<div class="dos"><div data-tour="tabla">' + tabla + "</div>" +
    '<div class="dos__detalle" data-tour="detalle">' + (abierto ? detallePedido(abierto) :
      '<div class="tarj centrado" style="color:var(--texto-2)"><p class="min">Toca un pedido de la lista para verlo completo aquí.</p></div>') +
    "</div></div>";
}

function detallePedido(p){
  const c = cliente(p.clienteId);
  const total = totalPedido(p), saldo = saldoPedido(p);
  let acciones = "";
  if(p.estado === "por_cobrar")
    acciones = '<button class="btn btn--sol btn--lg btn--bloque" data-a="ventana" data-v="cobrar" data-id="' + p.id + '">Cobrar e imprimir</button>' +
      '<button class="btn btn--fantasma btn--sm" style="margin-top:.5rem;width:100%" data-a="ventana" data-v="anularPedido" data-id="' + p.id + '">Anular el pedido</button>';
  else if(p.estado === "cobrado")
    acciones = '<button class="btn btn--sol btn--lg btn--bloque" data-a="entregar" data-id="' + p.id + '">Marcar como entregado</button>';
  else
    acciones = '<div class="aviso"><span class="aviso__ic">' + ic("info") + "</span><div><p class=\"aviso__d\">Este pedido quedó como <b>" +
      ESTADOS[p.estado].et.toLowerCase() + "</b>. No hay nada más que hacerle.</p></div></div>";

  return '<div class="tarj">' +
    '<div class="tarj__cab"><div class="crece" style="min-width:0"><h4>Pedido ' + p.id + "</h4>" +
      '<p class="min tenue">' + esc(c ? c.nombre : "Sin cliente") + (c && c.telefono ? " · " + esc(c.telefono) : "") + "</p></div>" +
      '<span class="chip ' + ESTADOS[p.estado].chip + '">' + ESTADOS[p.estado].et + "</span></div>" +
    '<div class="col" style="gap:0">' + p.lineas.map(l =>
      '<div class="linea-v"><span class="linea-v__n">' + l.cant + " × " + esc(nombreDe(l)) + "</span>" +
      '<span class="linea-v__t">' + num(l.cant * precioDe(l)) + "</span></div>").join("") + "</div>" +
    '<div style="margin-top:.7rem">' +
      '<div class="tot-fila"><span>Total</span><b>' + bs(total) + "</b></div>" +
      '<div class="tot-fila"><span>Abonado</span><b class="' + (p.abonado ? "verde" : "") + '">' + bs(p.abonado) + "</b></div>" +
      '<div class="tot-fila tot-fila--gran"><span>Saldo</span><b>' + bs(saldo) + "</b></div>" +
      '<div class="tot-fila"><span>Saldo en dólares oficiales</span><b>$ ' + num(enDivisa(saldo, "oficial")) + "</b></div>" +
      (total ? '<div class="barra-prog" style="margin-top:.5rem"><i style="width:' + Math.round(p.abonado / total * 100) + '%"></i></div>' : "") +
    "</div>" +
    '<div style="margin-top:.8rem" class="col" style="gap:.3rem">' +
      '<div class="tot-fila"><span>Se retira</span><b style="font-family:var(--sans)">' + fechaHora(p.retiro) + "</b></div>" +
      '<div class="tot-fila"><span>Llegó por</span><b style="font-family:var(--sans)">' + (p.canal === "whatsapp" ? "WhatsApp" : "Mostrador") + "</b></div>" +
    "</div>" +
    (p.nota ? '<div class="aviso" style="margin-top:.7rem"><span class="aviso__ic">' + ic("lapiz") +
      '</span><div><p class="aviso__t">Nota del cliente</p><p class="aviso__d">' + esc(p.nota) + "</p></div></div>" : "") +
    '<div style="margin-top:.9rem">' + acciones + "</div></div>";
}

/* ── Inventario ────────────────────────────────────────────────── */
function vistaInventario(){
  const q = D.q.inventario.trim().toLowerCase();
  const familias = ["todas", ...new Set(D.productos.map(p => p.familia))];
  const lista = D.productos.filter(p =>
    (D.filtro.inventario === "todas" || p.familia === D.filtro.inventario) &&
    (!q || p.nombre.toLowerCase().includes(q)));
  const bajos = D.productos.filter(bajoMinimo);

  const filtros = familias.map(f => '<button class="btn btn--contorno' + (D.filtro.inventario === f ? " es-activo" : "") +
    '" data-a="filtroInv" data-v="' + esc(f) + '">' + (f === "todas" ? "Todas" : esc(f)) + "</button>").join("");

  const tabla = lista.length
    ? '<div class="tabla-env"><table class="tabla"><thead><tr><th>Producto</th><th>Familia</th>' +
      '<th class="num">Hay</th><th class="num">Apartado</th><th class="num">Libre</th><th style="width:8rem">Reparto</th></tr></thead><tbody>' +
      lista.map(p => {
        const l = libre(p), base = Math.max(p.disponible, 1);
        return '<tr class="pulsable" data-a="ventana" data-v="existencia" data-id="' + p.id + '">' +
          "<td>" + esc(p.nombre) + (bajoMinimo(p) ? ' <span class="chip chip--rojo chip--xs">bajo el mínimo</span>' : "") + "</td>" +
          '<td class="min tenue">' + esc(p.familia) + "</td>" +
          '<td class="num' + (bajoMinimo(p) ? " rojo" : "") + '">' + p.disponible + "</td>" +
          '<td class="num' + (p.comprometido ? " ambar" : " tenue") + '">' + p.comprometido + "</td>" +
          '<td class="num" style="font-weight:600;color:' + (l <= 0 ? "var(--rojo)" : (l <= p.minimo ? "var(--sol-70)" : "var(--verde)")) + '">' + l + "</td>" +
          '<td><div class="medidor" style="height:.42rem"><i class="m-libre" style="width:' + Math.round(l / base * 100) +
            '%"></i><i class="m-comp" style="width:' + Math.round(p.comprometido / base * 100) + '%"></i></div></td></tr>';
      }).join("") + "</tbody></table></div>"
    : '<div class="vacio vacio--filtro"><span class="vacio__ic">' + ic("buscar","ic--lg") + "</span>" +
      "<h4>Ningún producto coincide</h4><p>Hay " + D.productos.length + " productos en total. Quita lo que escribiste o vuelve a «Todas».</p>" +
      '<button class="btn btn--contorno" data-a="limpiarInv">Quitar el filtro</button></div>';

  return '<div class="aviso" data-tour="explica"><span class="aviso__ic">' + ic("info") + "</span><div>" +
      '<p class="aviso__d"><b>Hay</b> es lo que está físicamente en la panadería. <b>Apartado</b> es lo que ya está reservado en pedidos que todavía no se cobran. ' +
      "<b>Libre</b> es lo único que de verdad puedes vender ahora mismo.</p></div>" +
      (bajos.length ? '<span class="chip chip--rojo" style="margin-left:auto;align-self:center">' + plural(bajos.length, "bajo el mínimo", "bajo el mínimo") + "</span>" : "") + "</div>" +
    '<div class="fila">' +
      '<div class="grupo-ent" style="max-width:18rem"><span class="grupo-ent__ic izq">' + ic("buscar") + "</span>" +
      '<input class="ent tiene-izq" id="q-inventario" data-in="inventario" value="' + esc(D.q.inventario) +
        '" placeholder="Nombre del producto" autocomplete="off"></div>' +
      '<div class="btn-grupo">' + filtros + "</div></div>" +
    '<div data-tour="tabla">' + tabla + "</div>" +
    '<div class="medidor-ley"><span><i style="background:var(--verde)"></i>Libre: se puede vender ahora</span>' +
    '<span><i style="background:var(--sol)"></i>Apartado en pedidos sin cobrar</span>' +
    '<span class="tenue">Toca cualquier fila para mover existencia.</span></div>';
}

/* ── Clientes ──────────────────────────────────────────────────── */
function vistaClientes(){
  const q = D.q.clientes.trim().toLowerCase();
  const qc = limpiarCedula(D.q.clientes);
  const lista = !q ? D.clientes : D.clientes.filter(c =>
    c.nombre.toLowerCase().includes(q) || (qc && limpiarCedula(c.cedula).includes(qc)) ||
    (c.telefono && c.telefono.replace(/\D/g, "").includes(q.replace(/\D/g, "")) && q.replace(/\D/g, "")));
  const abierto = D.clientes.find(c => c.id === D.clienteAbierto) || null;

  const listado = lista.length
    ? '<div class="lista">' + lista.map(c => {
        const suyos = D.pedidos.filter(p => p.clienteId === c.id);
        const debe = suyos.filter(p => p.estado === "por_cobrar").reduce((s, p) => s + saldoPedido(p), 0);
        return '<div class="item pulsable' + (c.id === D.clienteAbierto ? " es-activo" : "") + '" data-a="verCliente" data-id="' + c.id + '">' +
          '<span class="avatar">' + esc(c.nombre.split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase()) + "</span>" +
          '<div class="item__cuerpo"><p class="item__tit">' + esc(c.nombre) + "</p>" +
          '<p class="item__sub">' + esc([c.cedula, c.telefono].filter(Boolean).join(" · ") || "Sin cédula ni teléfono") + "</p></div>" +
          '<div class="item__fin">' + (debe ? '<span class="chip chip--sol chip--xs">Debe ' + num(debe, 0) + "</span>"
            : '<span class="min tenue">' + plural(suyos.length, "pedido", "pedidos") + "</span>") + "</div></div>";
      }).join("") + "</div>"
    : '<div class="vacio vacio--filtro"><span class="vacio__ic">' + ic("gente","ic--lg") + "</span>" +
      "<h4>No aparece nadie con «" + esc(D.q.clientes) + "»</h4>" +
      "<p>Busca sin puntos y sin la V, o con parte del nombre. Si de verdad no está, regístralo: el formulario ya trae escrito lo que buscaste.</p>" +
      '<button class="btn btn--sol" data-a="ventana" data-v="cliente">' + ic("mas") + "Registrar «" + esc(D.q.clientes) + "»</button></div>";

  return '<div class="dos"><div class="col" data-tour="buscador">' +
      '<div class="grupo-ent"><span class="grupo-ent__ic izq">' + ic("buscar") + "</span>" +
      '<input class="ent ent--lg tiene-izq" id="q-clientes" data-in="clientes" value="' + esc(D.q.clientes) +
        '" placeholder="Cédula, RIF o nombre" autocomplete="off"></div>' +
      '<p class="nota-pie">Primero se busca. Registrar es lo que se hace solo si no aparece.</p>' +
      '<div data-tour="lista">' + listado + "</div></div>" +
    '<div class="dos__detalle" data-tour="ficha">' + (abierto ? fichaCliente(abierto) :
      '<div class="tarj centrado" style="color:var(--texto-2)"><p class="min">Toca un cliente para ver su ficha y sus pedidos.</p></div>') +
    "</div></div>";
}

function fichaCliente(c){
  const suyos = D.pedidos.filter(p => p.clienteId === c.id);
  const comprado = suyos.filter(p => p.estado !== "anulado").reduce((s, p) => s + totalPedido(p), 0);
  const debe = suyos.filter(p => p.estado === "por_cobrar").reduce((s, p) => s + saldoPedido(p), 0);
  const falta = [!c.cedula && "la cédula", !c.telefono && "el teléfono"].filter(Boolean);
  return '<div class="tarj">' +
    '<div class="fila" style="gap:.8rem;margin-bottom:.9rem;align-items:flex-start">' +
      '<span class="avatar avatar--lg">' + esc(c.nombre.split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase()) + "</span>" +
      '<div class="crece" style="min-width:0"><p style="font-weight:600;line-height:1.3">' + esc(c.nombre) + "</p>" +
      '<p class="min tenue">' + esc(c.cedula || "Sin cédula") + "</p>" +
      '<p class="min tenue">' + esc(c.telefono || "Sin teléfono") + (c.zona ? " · " + esc(c.zona) : "") + "</p></div></div>" +
    (falta.length ? '<div class="aviso aviso--sol" style="margin-bottom:.8rem"><span class="aviso__ic">' + ic("info") +
      '</span><div><p class="aviso__d">Le falta ' + falta.join(" y ") + ". Sin eso, la próxima vez hay que volver a preguntarle todo.</p></div></div>" : "") +
    '<div class="rejilla-3" style="gap:.5rem;margin-bottom:.8rem">' +
      '<div><p class="rot">PEDIDOS</p><p class="cifra cifra--md">' + suyos.length + "</p></div>" +
      '<div><p class="rot">HA COMPRADO</p><p class="cifra cifra--md">' + num(comprado, 0) + "</p></div>" +
      '<div><p class="rot">DEBE</p><p class="cifra cifra--md' + (debe ? " ambar" : " tenue") + '">' + num(debe, 0) + "</p></div></div>" +
    '<p class="rot" style="margin-bottom:.4rem">SUS PEDIDOS</p>' +
    (suyos.length ? '<div class="col" style="gap:0">' + suyos.map(p =>
        '<div class="linea-v pulsable" data-a="verPedido" data-id="' + p.id + '">' +
        '<span class="linea-v__n">' + p.id + " · " + esc(p.lineas.map(l => nombreDe(l)).join(", ")) + "</span>" +
        '<span class="chip ' + ESTADOS[p.estado].chip + ' chip--xs">' + ESTADOS[p.estado].et + "</span>" +
        '<span class="linea-v__t">' + num(saldoPedido(p)) + "</span></div>").join("") + "</div>"
      : '<p class="min tenue">Todavía no ha encargado nada.</p>') +
    '<div class="tarj__pie"><button class="btn btn--sol crece" data-a="montar" data-id="' + c.id + '">Montar pedido</button>' +
    '<button class="btn btn--contorno" data-a="ventana" data-v="cliente" data-id="' + c.id + '">' + ic("lapiz") + "</button></div></div>";
}

/* ── Facturación ───────────────────────────────────────────────── */
function vistaFacturacion(){
  const docs = [...D.documentos].sort((a, b) => b.hora - a.hora);
  const abierto = D.documentos.find(d => d.id === D.docAbierto) || null;

  if(!docs.length)
    return '<div class="vacio"><span class="vacio__ic">' + ic("recibo","ic--lg") + "</span>" +
      "<h4>Todavía no se ha cobrado nada hoy</h4>" +
      "<p>Cada cobro que hagas aparece aquí con su ticket, y desde aquí se reimprime o se anula.</p>" +
      '<button class="btn btn--sol" data-a="ir" data-p="venta">Ir a Venta</button></div>';

  const tabla = '<div class="tabla-env"><table class="tabla tabla--densa"><thead><tr>' +
    "<th>Ticket</th><th>Hora</th><th>Cliente</th><th>Pago</th><th class=\"num\">Total Bs</th><th>Estado</th></tr></thead><tbody>" +
    docs.map(d => '<tr class="pulsable' + (d.id === D.docAbierto ? " es-sel" : "") + '" data-a="verDoc" data-id="' + d.id + '">' +
      '<td class="cifra cifra--sm">' + String(d.id).padStart(5, "0") + "</td>" +
      '<td class="min tenue">' + hora(d.hora) + "</td>" +
      '<td><span class="recorte">' + esc(d.cliente) + "</span></td>" +
      '<td class="min tenue">' + esc(d.pago) + "</td>" +
      '<td class="num' + (d.anulado ? " tachado" : "") + '">' + num(d.total) + "</td>" +
      "<td>" + (d.anulado ? '<span class="chip chip--rojo chip--xs">Anulado</span>' : '<span class="chip chip--verde chip--xs">Cobrado</span>') +
      "</td></tr>").join("") + "</tbody></table></div>";

  const panel = abierto
    ? '<div class="tarj" style="display:flex;flex-direction:column;align-items:center">' + ticketHTML(abierto) +
      '<div class="fila ancho" style="margin-top:.9rem">' +
      '<button class="btn btn--sol crece" data-a="ventana" data-v="ticket" data-id="' + abierto.id + '">' + ic("imprimir") + "Reimprimir</button>" +
      (abierto.anulado ? "" : '<button class="btn btn--contorno" style="color:var(--rojo);border-color:var(--rojo-linea)" data-a="ventana" data-v="anularDoc" data-id="' + abierto.id + '">Anular</button>') +
      "</div></div>"
    : '<div class="tarj centrado" style="color:var(--texto-2)"><p class="min">Toca un documento y aquí aparece el ticket, tal como sale de la tiquera.</p></div>';

  return '<div class="dos"><div data-tour="tabla">' + tabla + '</div><div class="dos__detalle" data-tour="ticket">' + panel + "</div></div>";
}

/* ── Ventas y cierre ───────────────────────────────────────────── */
function vistaCierre(){
  const buenos = ventasDelDia();
  const total = vendidoHoy();
  const anulados = D.documentos.filter(d => d.anulado);
  const pend = porCobrar();
  const sinEntregar = D.pedidos.filter(p => p.estado === "cobrado");

  const pagos = {};
  buenos.forEach(d => {
    pagos[d.pago] = pagos[d.pago] || { n:0, monto:0 };
    pagos[d.pago].n++; pagos[d.pago].monto += d.total;
  });
  const filasPago = Object.keys(pagos).sort((a, b) => pagos[b].monto - pagos[a].monto).map(k => {
    const p = pagos[k], parte = total ? p.monto / total * 100 : 0;
    return "<tr><td>" + esc(k) + '</td><td class="num">' + p.n + '</td><td class="num">' + num(p.monto) + "</td>" +
      '<td class="num">' + num(parte, 1) + '%</td><td style="width:6rem"><div class="barra-parte"><i style="width:' + parte + '%"></i></div></td></tr>';
  }).join("");

  const salieron = {};
  buenos.forEach(d => d.lineas.forEach(l => {
    const k = nombreDe(l);
    salieron[k] = salieron[k] || { u:0, monto:0 };
    salieron[k].u += l.cant; salieron[k].monto += l.cant * precioDe(l);
  }));
  const filasSalieron = Object.keys(salieron).sort((a, b) => salieron[b].monto - salieron[a].monto).slice(0, 6).map(k =>
    '<div class="linea-v"><span class="linea-v__n">' + esc(k) + '</span><span class="min tenue">' + salieron[k].u +
    ' u.</span><span class="linea-v__t">' + num(salieron[k].monto) + "</span></div>").join("");

  return '<div class="regla-fila" data-tour="cifras">' +
      '<div style="grid-column:span 2"><p class="et">' + ic("billete","ic--sm") + "Vendido hoy</p>" +
      '<p class="cifra cifra--xl"><span class="moneda">Bs</span>' + num(total) + "</p>" +
      '<p class="min tenue" style="margin-top:.2rem">' + plural(buenos.length, "documento", "documentos") + " · los anulados no suman</p></div>" +
      '<div><p class="et">En dólares oficiales</p><p class="cifra cifra--lg"><span class="moneda">$</span>' + num(enDivisa(total, "oficial")) + "</p>" +
      '<p class="min tenue">tasa ' + num(D.tasas.oficial) + "</p></div>" +
      '<div><p class="et">En dólares de mercado</p><p class="cifra cifra--lg"><span class="moneda">$</span>' + num(enDivisa(total, "mercado")) + "</p>" +
      '<p class="min tenue">tasa ' + num(D.tasas.mercado) + "</p></div></div>" +
    '<p class="nota-pie">' + ic("info","ic--sm") +
      " El equivalente en dólares de mercado es información interna para cuidar el margen. El cobro siempre es en bolívares a la tasa oficial.</p>" +
    '<div class="dos"><div class="col">' +
      '<div class="tarj" data-tour="pagos"><div class="tarj__cab"><h4>Cómo pagaron</h4></div>' +
      (filasPago ? '<div class="tabla-env" style="border:0"><table class="tabla tabla--densa"><thead><tr><th>Forma de pago</th>' +
        '<th class="num">Operaciones</th><th class="num">Monto Bs</th><th class="num">Parte</th><th></th></tr></thead><tbody>' +
        filasPago + "</tbody></table></div>"
        : '<p class="min tenue">Todavía no se ha cobrado nada hoy.</p>') + "</div>" +
      '<div class="tarj"><div class="tarj__cab"><h4>Lo que más salió</h4></div>' +
      (filasSalieron ? '<div class="col" style="gap:0">' + filasSalieron + "</div>" : '<p class="min tenue">Nada todavía.</p>') + "</div>" +
    "</div>" +
    '<div class="col"><div class="tarj" data-tour="antes"><div class="tarj__cab"><h4>Antes de cerrar</h4></div>' +
      '<div class="col" style="gap:.35rem">' +
      '<div class="tot-fila"><span>Pedidos sin entregar</span><b style="font-family:var(--sans)">' + sinEntregar.length + "</b></div>" +
      '<div class="tot-fila"><span>Saldo por cobrar</span><b>' + bs(saldoTotal()) + "</b></div>" +
      '<div class="tot-fila"><span>Pedidos sin cobrar</span><b style="font-family:var(--sans)">' + pend.length + "</b></div>" +
      '<div class="tot-fila"><span>Anulado hoy</span><b>' + bs(anulados.reduce((s, d) => s + d.total, 0)) + "</b></div>" +
      '<div class="tot-fila"><span>Tasa con la que se trabajó</span><b>' + num(D.tasas.oficial) + "</b></div></div>" +
      '<div class="aviso aviso--sol" style="margin-top:.8rem"><span class="aviso__ic">' + ic("info") +
      '</span><div><p class="aviso__d">Los pedidos pendientes no se cierran solos: siguen ahí mañana, con su saldo.</p></div></div>' +
      "</div></div></div>";
}

/* ── Usuarios ──────────────────────────────────────────────────── */
function vistaUsuarios(){
  const ultimoDe = nombre => D.bitacora.find(b => b.usuario === nombre);

  const gente = D.usuarios.map(u => {
    const ult = ultimoDe(u.nombre);
    const soyYo = D.usuario && u.id === D.usuario.id;
    return '<div class="item" style="padding-left:0;padding-right:0"><span class="avatar">' + esc(u.iniciales) + "</span>" +
      '<div class="item__cuerpo"><p class="item__tit">' + esc(u.nombre) +
        (soyYo ? ' <span class="chip chip--verde chip--xs">Eres tú</span>' : "") + "</p>" +
      '<p class="item__sub">entra como <span style="font-family:var(--mono)">' + esc(u.usuario) + "</span>" +
        " · entra a " + cuentaPermisos(u).ve + " de " + MODULOS.length + " pantallas, cambia " + cuentaPermisos(u).cambia +
        (ult ? " · lo último, " + fechaHora(ult.hora) : "") + "</p></div>" +
      (puedeEditar("usuarios")
        ? '<button class="btn btn--contorno btn--sm" data-a="ventana" data-v="permisos" data-id="' + u.id +
          '" title="Qué puede hacer">' + ic("candado", "ic--sm") + "Permisos</button>"
        : "") +
      '<button class="chip chip--liso pastilla-rol' + (u.rol === "duena" ? " chip--sol" : "") +
        '" data-a="rol" data-id="' + u.id + '" title="Tocar para cambiar el rol">' +
      ROLES[u.rol].nombre + " " + ic("abajo","ic--sm") + "</button></div>";
  }).join("");

  const roles = Object.keys(ROLES).map(r => {
    const cuantos = D.usuarios.filter(u => u.rol === r).length;
    return '<div style="padding:.6rem 0;border-bottom:1px solid var(--linea)">' +
      '<p class="fila" style="gap:.5rem"><b style="font-size:.9rem">' + ROLES[r].nombre + "</b>" +
      '<span class="chip chip--liso chip--xs chip--hueco" style="margin-left:auto">' +
        plural(cuantos, "persona", "personas") + "</span></p>" +
      '<p class="min tenue" style="margin-top:.2rem">' + ROLES[r].ve + "</p></div>";
  }).join("");

  return '<div class="dos"><div class="col">' +
      '<div class="tarj" data-tour="gente"><div class="tarj__cab">' + ic("candado","ambar") + "<h4>Quién puede entrar</h4>" +
      '<button class="btn btn--contorno btn--sm" data-a="ventana" data-v="usuario" data-tour="agregar">' +
        ic("mas") + "Agregar</button></div>" +
      gente +
      '<p class="nota-pie" style="margin-top:.8rem">Cada quien entra con su usuario y su contraseña. ' +
      "Todo lo que haga queda firmado con su nombre en la bitácora, y eso solo sirve si nadie entra con la cuenta de otro.</p></div>" +
    "</div>" +

    '<div class="col">' +
      '<div class="tarj" data-tour="roles"><div class="tarj__cab">' + ic("gente","ambar") + "<h4>Qué puede hacer cada rol</h4></div>" +
      '<div class="col" style="gap:0">' + roles + "</div>" +
      '<p class="nota-pie" style="margin-top:.7rem">Toca la pastilla del rol al lado de un nombre y va cambiando entre los tres. ' +
      "El cambio queda al instante y se anota en la bitácora.</p></div>" +

      '<div class="tarj"><div class="tarj__cab">' + ic("entrar","ambar") + "<h4>Cómo se entra</h4></div>" +
      '<p class="min tenue">En la pantalla de entrada se escriben las dos cosas: el usuario ' +
      "—el nombre corto que aparece debajo de cada persona— y la contraseña. " +
      'Las que se agregan aquí arrancan con <b style="font-family:var(--mono)">1234</b>.</p>' +
      '<p class="nota-pie" style="margin-top:.6rem">Quién hizo qué, y a qué hora, se lee en Ajustes: la bitácora guarda cada venta, cobro, anulación y movimiento de inventario.</p></div>' +
    "</div></div>";
}

/* ═══════════════════════════════════════════════════════════════
   VENTANAS — se abren encima, se cierran con Escape o tocando fuera
   ═══════════════════════════════════════════════════════════════ */
function cerrarVentana(){ D.ventana = null; D.cobro = null; render(); }

function cab(titulo, sub){
  return '<div class="vent__cab"><div class="crece" style="min-width:0"><h4>' + esc(titulo) + "</h4>" +
    (sub ? '<p class="min tenue">' + sub + "</p>" : "") + "</div>" +
    '<button class="btn btn--fantasma btn--sm btn--icono" data-a="cerrarVentana" aria-label="Cerrar">' + ic("x") + "</button></div>";
}

function pintarCapa(){
  const capa = $("#capa");
  if(!D.ventana){ capa.classList.add("oculto"); capa.innerHTML = ""; return; }
  capa.classList.remove("oculto");
  capa.innerHTML = ventanaHTML();
  const primero = capa.querySelector("input:not([type=radio]):not([type=checkbox]), textarea");
  if(primero && !D.foco) setTimeout(() => primero.focus(), 30);
}

function ventanaHTML(){
  const v = D.ventana.v;
  if(v === "cobrar")         return ventCobrar();
  if(v === "ticket")         return ventTicket();
  if(v === "tasas")          return ventTasas();
  if(v === "cliente")        return ventCliente();
  if(v === "existencia")     return ventExistencia();
  if(v === "usuario")        return ventUsuario();
  if(v === "empezarCero")    return ventEmpezarCero();
  if(v === "permisos")       return ventPermisos();
  if(v === "puerta")         return ventPuerta();
  if(v === "actualizar")     return ventActualizar();
  if(v === "acerca")         return ventAcerca();
  if(v === "atajos")         return ventAtajos();
  if(v === "nuevoProducto")  return ventNuevoProducto();
  if(v === "anularPedido")   return ventAnularPedido();
  if(v === "anularDoc")      return ventAnularDoc();
  if(v === "cerrarCaja")     return ventCerrarCaja();
  if(v === "dejarPedido")    return ventDejarPedido();
  return "";
}

/* ── Montar pedido, tres pasos ─────────────────────────────────── */
function nuevoBorrador(clienteId){
  return { lineas:[], q:"", canal:"mostrador", dia:0, fecha:"", hora:"16:00",
           abono:0, nota:"", clienteId: clienteId || null, qCliente:"" };
}
function totalBorrador(){ return D.borrador.lineas.reduce((s, l) => s + l.cant * l.precio, 0); }
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function fechaLarga(d){
  const hoy = new Date(), man = new Date(); man.setDate(man.getDate() + 1);
  const cuando = mismoDia(d, hoy) ? "hoy, " : (mismoDia(d, man) ? "mañana, " : DIAS[d.getDay()] + " ");
  return cuando + fechaDMA(d) + " a las " + hora(d);
}

/* La cabecera se dibuja antes que la pantalla, así que cualquiera de estas
   puede ser la primera en pedir el borrador: se crea aquí si aún no existe. */
const MIN_BUSQUEDA = 2;   // no se lista nada hasta escribir esto

/* Nadie puede abonar más de lo que cuesta el pedido. Se topa aquí,
   y también cada vez que cambian los productos: si quitas algo y el
   abono se pasa, baja solo y la pantalla dice por qué. */
function fijarAbono(v){
  const b = borradorVivo();
  const tope = totalBorrador();
  const n = Math.max(0, aNumero(v));
  b.abonoTope = n > tope;
  b.abono = Math.min(n, tope);
}

function borradorVivo(){
  if(!D.borrador) D.borrador = nuevoBorrador();
  return D.borrador;
}

function botonesMontar(){
  const b = borradorVivo();
  return '<button class="btn btn--fantasma" data-a="cancelarMontar">Cancelar</button>' +
    '<button class="btn btn--sol" data-a="bGuardar"' + (b.lineas.length ? "" : " disabled") + ">Guardar el pedido</button>";
}

/* Una tarjeta por paso. La siguiente no se abre hasta que la anterior está lista. */
function tarjetaPaso(n, titulo, abierta, listo, pista, dentro, tour){
  const clase = abierta ? (listo ? " es-listo" : "") : " es-bloqueado";
  return '<section class="paso-card' + clase + '"' + (tour ? ' data-tour="' + tour + '"' : "") + ">" +
    '<div class="paso-card__cab"><span class="paso-card__n">' + (listo ? ic("ok") : n) + "</span>" +
    '<span class="paso-card__t">' + titulo + "</span></div>" +
    (abierta ? dentro : '<p class="paso-card__pista">' + pista + "</p>") + "</section>";
}

function vistaMontar(){
  const b = borradorVivo();
  const eleg = cliente(b.clienteId);
  const hayLineas = b.lineas.length > 0;
  const inicial = c => esc(c.nombre.split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase());

  const listo1 = busca1.length >= MIN_BUSQUEDA;
  const q1 = busca1.toLowerCase(), qc = limpiarCedula(busca1);
  const candidatos = listo1

    ? '<div class="elegido"><span class="avatar">' + inicial(eleg) + "</span>" +

      '<button class="btn btn--contorno btn--sm" data-a="bCliente" data-id="">Cambiar</button></div>'
    : '<div class="combo">' +
      '<div class="grupo-ent"><span class="grupo-ent__ic izq">' + ic("buscar") + "</span>" +
      '<input class="ent ent--lg tiene-izq tiene-der" id="q-bcliente" data-in="bcliente" value="' + esc(b.qCliente) +
        '" placeholder="Escribe la cédula o el nombre" autocomplete="off">' +
      '<span class="grupo-ent__ic der">' + ic("abajo") + "</span></div>" +
      (!listo1
        ? '<p class="pista-busca">' + ic("buscar","ic--sm") + " Escribe al menos dos letras de su nombre, o los primeros números de su cédula.</p>"
        : (candidatos.length
          ? '<div class="combo__lista">' + candidatos.map(c =>
              '<button class="combo__op" data-a="bCliente" data-id="' + c.id + '">' +
              '<span class="avatar avatar--sm">' + inicial(c) + "</span>" +
              '<span class="crece" style="min-width:0"><span class="item__tit">' + esc(c.nombre) + "</span>" +
              '<span class="item__sub" style="display:block">' + esc([c.cedula, c.telefono].filter(Boolean).join(" · ") || "Sin cédula ni teléfono") +
              "</span></span></button>").join("") + "</div>"
          : '<div class="aviso" style="margin-top:.6rem"><span class="aviso__ic">' + ic("info") + "</span><div>" +
            '<p class="aviso__d">No aparece nadie con «' + esc(busca1) + "». Búscalo sin puntos y sin la V, o anótalo nuevo.</p></div></div>")) +
      '<button class="btn btn--contorno" style="margin-top:.7rem" data-a="bNuevoCliente">' + ic("mas") + "Anotar un cliente nuevo</button></div>";

  /* ── 2 · Qué lleva: buscar por código, nombre o descripción ── */
  const q2 = b.q.trim();
  const listo2 = q2.length >= MIN_BUSQUEDA;
  const encontrados = listo2 ? buscarProductos(q2) : [];
  const dentroProd =
    '<div class="grupo-ent"><span class="grupo-ent__ic izq">' + ic("buscar") + "</span>" +
    '<input class="ent ent--lg tiene-izq" id="q-borrador" data-in="borrador" value="' + esc(b.q) +
      '" placeholder="Código, nombre o descripción — y Enter" autocomplete="off"></div>' +
    '<div class="fila" style="justify-content:space-between">' +
      '<p class="rot">' + (listo2 ? plural(encontrados.length, "COINCIDENCIA", "COINCIDENCIAS") : "BUSCA EL PRODUCTO") + "</p>" +
      (q2 ? '<button class="btn btn--enlace min" data-a="limpiarBorrador">Borrar la búsqueda</button>' : "") + "</div>" +
    (!listo2
      ? '<p class="pista-busca">' + ic("buscar","ic--sm") + " Escribe al menos dos letras del nombre, o el código, o cómo es: «queso», «PAN-005», «hojaldre».</p>"
      : encontrados.length
      ? '<div class="rejilla-prod rejilla-prod--alta">' + encontrados.map(p =>
          '<button class="prod" data-a="bAgregar" data-id="' + p.id + '">' +
          '<span class="prod__cod">' + esc(p.codigo) + "</span>" +
          '<span class="prod__n">' + esc(p.nombre) + "</span>" +
          '<span class="prod__d">' + esc(p.descripcion) + "</span>" +
          '<span class="prod__p">' + bs(p.precio) + "</span>" +
          '<span class="prod__x">' + libre(p) + " libres</span></button>").join("") + "</div>"

      : '<p class="campo__ay">Como mucho ' + bs(total) + ", que es lo que cuesta el pedido.</p>") + "</div>" +
    '<div class="fila" style="gap:.4rem">' +
      '<button class="btn btn--contorno btn--sm" data-a="bAbonoRapido" data-v="0">Nada</button>' +
      '<button class="btn btn--contorno btn--sm" data-a="bAbonoRapido" data-v="' + Math.round(total * 0.5) + '">La mitad</button>' +
      '<button class="btn btn--contorno btn--sm" data-a="bAbonoRapido" data-v="' + total + '">Todo</button></div>' +
    '<div><div class="tot-fila"><span>Total del pedido</span><b>' + bs(total) + "</b></div>" +

/* El resumen del pedido, con forma de factura */
function facturaBorrador(){
  const b = borradorVivo();
  const eleg = cliente(b.clienteId);
  const total = totalBorrador();
  const saldo = Math.max(0, total - b.abono);
  return '<div class="factura">' +
    '<div class="factura__cab">' + ic("recibo","ic--lg") +
      '<div class="crece"><p class="factura__t">Resumen del pedido</p>' +
      '<p class="min tenue">Todavía sin guardar</p></div></div>' +
    '<div class="factura__datos">' +
      '<div class="tot-fila"><span>Cliente</span><b style="font-family:var(--sans);text-align:right">' +
        esc(eleg ? eleg.nombre : "— sin escoger —") + "</b></div>" +
      '<div class="tot-fila"><span>Se retira</span><b style="font-family:var(--sans)">' + fechaHora(fechaRetiro()) + "</b></div>" +
      '<div class="tot-fila"><span>Llegó por</span><b style="font-family:var(--sans)">' + (b.canal === "whatsapp" ? "WhatsApp" : "Mostrador") + "</b></div>" +
    "</div>" +
    '<div class="factura__cuerpo">' +
      (b.lineas.length
        ? "<table><thead><tr><th>Cant</th><th>Descripción</th><th class=\"num\">Total</th></tr></thead><tbody>" +
          b.lineas.map(l => '<tr><td class="num" style="text-align:left">' + l.cant + "</td>" +
            "<td>" + esc(l.nombre) + '<span class="factura__u">' + bs(l.precio) + " c/u</span></td>" +
            '<td class="num">' + num(l.cant * l.precio) + "</td></tr>").join("") + "</tbody></table>"
        : '<p class="min tenue centrado" style="padding:1.4rem 0">Aquí va apareciendo lo que pongas en el pedido.</p>') +
    "</div>" +
    '<div class="factura__pie">' +
      '<div class="tot-fila"><span>Subtotal</span><b>' + bs(total) + "</b></div>" +
      '<div class="tot-fila"><span>Abono</span><b class="verde">− ' + bs(b.abono) + "</b></div>" +
      '<div class="tot-fila tot-fila--gran"><span>Queda debiendo</span><b>' + bs(saldo) + "</b></div>" +
      '<div class="tot-fila"><span>En dólares oficiales</span><b>$ ' + num(enDivisa(saldo, "oficial")) + "</b></div>" +
    "</div></div>";
}

function fechaRetiro(){
  const b = borradorVivo();
  const [h, m] = b.hora.split(":").map(Number);
  if(b.dia === "otro" && b.fecha){
    const p = b.fecha.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2], h || 0, m || 0, 0, 0);
  }
  return hoyMas(Number(b.dia) || 0, h, m);
}

/* Salir del asistente con algo escrito es destructivo: se pregunta. */
function borradorConAlgo(){
  const b = D.borrador;
  return !!b && (b.lineas.length > 0 || b.clienteId || b.abono > 0 || (b.nota || "").trim() !== "");
}
function ventDejarPedido(){

/* ── Cobrar ────────────────────────────────────────────────────── */
function ventCobrar(){
  const p = D.pedidos.find(x => x.id === D.ventana.id);
  const falta = saldoPedido(p);
  if(!D.cobro) D.cobro = { pago: formasPago()[0].id, recibe: falta };
  const enUsd = D.cobro.pago === "efectivo_usd";
  const recibeBs = enUsd ? D.cobro.recibe * D.tasas.oficial : D.cobro.recibe;
  const vuelto = Math.max(0, recibeBs - falta);

  return '<div class="vent">' + cab("Cobrar el pedido " + p.id, esc(nombreCliente(p))) +
    '<div class="vent__cuerpo">' +
      "<div>" +
      '<div class="tot-fila"><span>Total del pedido</span><b>' + bs(totalPedido(p)) + "</b></div>" +
      '<div class="tot-fila"><span>Ya había abonado</span><b class="verde">' + bs(p.abonado) + "</b></div>" +
      '<div class="tot-fila tot-fila--gran"><span>Falta</span><b>' + bs(falta) + "</b></div>" +
      '<div class="tot-fila"><span>En dólares oficiales</span><b>$ ' + num(enDivisa(falta, "oficial")) + "</b></div></div>" +
      '<div><p class="rot" style="margin-bottom:.4rem">CON QUÉ PAGA</p><div class="rejilla-2" style="gap:.4rem">' +
      formasPago().map(f => '<button class="btn btn--contorno" data-a="cobroPago" data-id="' + f.id + '"' +
        (D.cobro.pago === f.id ? ' style="background:var(--sol-vela);border-color:var(--sol)"' : "") + ">" + ic(f.ic) + esc(f.nombre) + "</button>").join("") +
      "</div></div>" +
      '<div class="rejilla-2">' +
        '<div class="campo"><label class="campo__et">Recibe</label><div class="grupo-ent">' +
        '<span class="grupo-ent__fijo">' + (enUsd ? "$" : "Bs") + "</span>" +
        '<input class="ent ent--lg ent--cifra" id="cobro-recibe" data-a="cobroRecibe" value="' + D.cobro.recibe + '" inputmode="decimal"></div>' +
        (enUsd ? '<p class="campo__ay" id="cobro-eq">Equivale a ' + bs(recibeBs) + "</p>" : "") + "</div>" +
        '<div class="campo"><label class="campo__et">Vuelto</label><div class="grupo-ent">' +
        '<span class="grupo-ent__fijo">Bs</span><input class="ent ent--lg ent--cifra" id="cobro-vuelto" value="' + num(vuelto) + '" readonly></div>' +
        '<p class="campo__ay">Siempre en bolívares, a la tasa oficial.</p></div></div>' +
      '<div class="fila" style="gap:.4rem">' +
      [falta].concat([1000, 5000, 10000].map(p => Math.ceil(falta / p) * p))
        .filter((v, i, a) => a.indexOf(v) === i).slice(0, 4)
        .map((v, i) => '<button class="btn btn--contorno btn--sm" data-a="cobroMonto" data-v="' + v + '">' +
          (i === 0 ? "Exacto" : bs(v)) + "</button>").join("") + "</div>" +
    "</div>" +
    '<div class="vent__pie"><button class="btn btn--fantasma" data-a="cerrarVentana">Cancelar</button>' +
    '<button class="btn btn--sol" style="margin-left:auto" data-a="cobrarPedido" data-id="' + p.id + '">Cobrar e imprimir</button></div></div>';
}

/* ── Calculadora de tasas ──────────────────────────────────────── */
function ventTasas(){
  if(!D.calc) D.calc = { monto: 1000, moneda: "bs" };
  if(!hayTasa(D.calc.moneda) && D.calc.moneda !== "bs") D.calc.moneda = "bs";
  const t = D.tasas;
  const montoBs = D.calc.moneda === "bs" ? D.calc.monto : D.calc.monto * t[D.calc.moneda];
  const linea = (et, valor, nota) =>
    '<div class="cifra-t" style="padding:.65rem .85rem"><p class="cifra-t__et">' + et + "</p>" +
    '<p class="cifra cifra--md">' + valor + "</p>" + (nota ? '<p class="cifra-t__pie">' + nota + "</p>" : "") + "</div>";
  const brecha = (t.mercado / t.oficial - 1) * 100;

  const paridad = hayTasa("euro")
    ? '<div class="aviso" style="margin-bottom:.5rem"><span class="aviso__ic">' + ic("tasa") + "</span><div>" +
      '<p class="aviso__t">Euro contra dólar oficial: ' + num(t.euro / t.oficial * 100 - 100, 2) + "%</p>" +
      '<p class="aviso__d">Esto es <b>paridad</b> entre dos monedas, no brecha. El euro simplemente vale más que el dólar.</p></div></div>'
    : '<div class="aviso" style="margin-bottom:.5rem"><span class="aviso__ic">' + ic("info") + "</span><div>" +
      '<p class="aviso__t">Euro contra dólar oficial: sin calcular</p>' +
      '<p class="aviso__d">Falta la tasa del euro. Escríbela en Ajustes y aquí aparece la paridad, que no es lo mismo que la brecha.</p></div></div>';

  return '<div class="vent vent--angosta">' + cab("Calculadora de tasas", "Cuánto es esto en cada moneda") +
    '<div class="vent__cuerpo">' +
      '<div class="campo"><label class="campo__et">Escribe un monto</label>' +
      '<input class="ent ent--lg ent--cifra" id="calc-monto" data-a="calcMonto" value="' + D.calc.monto + '" inputmode="decimal"></div>' +
      '<div class="campo"><span class="campo__et">Ese monto está en</span><div class="alt ancho">' +
      [["bs","Bs"],["oficial","$ oficial"],["euro","€"],["mercado","$ mercado"]].map(m =>
        '<button aria-pressed="' + (D.calc.moneda === m[0]) + '" data-a="calcMoneda" data-v="' + m[0] + '" style="flex:1"' +
        (m[0] !== "bs" && !hayTasa(m[0]) ? " disabled" : "") + ">" + m[1] + "</button>").join("") +
      "</div></div>" +
      '<div class="col" style="gap:.45rem">' +
        (D.calc.moneda !== "bs"      ? linea("Bolívares", bs(montoBs)) : "") +
        (D.calc.moneda !== "oficial" ? linea("Dólares oficiales", "$ " + num(montoBs / t.oficial), "tasa " + num(t.oficial, 4)) : "") +
        (D.calc.moneda !== "euro"    ? (hayTasa("euro")
            ? linea("Euros oficiales", "€ " + num(montoBs / t.euro), "tasa " + num(t.euro, 4))
            : linea("Euros oficiales", '<span class="tenue" style="font-size:.85rem;font-family:var(--sans)">Sin cargar</span>', "escríbela en Ajustes")) : "") +
        (D.calc.moneda !== "mercado" ? linea("Dólares de mercado", "$ " + num(montoBs / t.mercado), "tasa " + num(t.mercado, 4)) : "") +
      "</div>" +
      '<div><p class="rot" style="margin-bottom:.4rem">LAS DOS DIFERENCIAS, QUE NO SON LO MISMO</p>' + paridad +
      '<div class="aviso aviso--sol"><span class="aviso__ic">' + ic("alerta") + "</span><div>" +
        '<p class="aviso__t">Dólar de mercado contra oficial: ' + num(brecha, 2) + "%</p>" +
        '<p class="aviso__d">Esta sí es la <b>brecha</b>. Es lo que hay que vigilar para no vender por debajo del costo.</p></div></div></div>' +
      '<p class="nota-pie">' + ic("refrescar","ic--sm") + " La oficial viene de <b>" + esc(FUENTE_TASA.nombre) + "</b>" +
        (D.tasaFecha ? ", del " + fechaCorta(D.tasaFecha) : "") + ". " +
        (D.tasaEstado === "fallo" ? "Ahora mismo la fuente no contesta, así que ves la última conocida." :
         D.tasaEstado === "manual" ? "Ahora mismo está escrita a mano." : "") + "</p>" +
    '</div><div class="vent__pie"><button class="btn btn--contorno" data-a="recargarTasa">' + ic("refrescar") + "Volver a traerla</button>" +
    '<button class="btn btn--sol" style="margin-left:auto" data-a="cerrarVentana">Listo</button></div></div>';
}

function ventPermisos(){

    '<div class="vent__cuerpo"><p class="min tenue">Esa persona ya no está.</p></div></div>';

  const yo = D.usuario && u.id === D.usuario.id;
  const filas = MODULOS.map(m => {

    return '<div class="linea-v" style="gap:.8rem;flex-wrap:wrap">' +

        '<button aria-pressed="' + (val === o[0]) + '"' + (yo ? " disabled" : "") +

    return '<div class="vent vent--angosta">' + cab("Ya la tienes instalada", "Se abre mejor desde su propio icono") +
      '<div class="vent__cuerpo"><div class="centrado">' + logoImg("2.2rem") + "</div>" + bien +

        : '<p class="nota-pie">Si no salta, tócala en la pantalla de inicio: es la misma, con los mismos datos.</p>') +
      '</div><div class="vent__pie"><button class="btn btn--fantasma" data-a="cerrarVentana">Seguir en el navegador</button>' +
      '<button class="btn btn--sol" style="margin-left:auto" data-a="abrirApp"' + (D.pwa.abriendo ? " disabled" : "") + ">" +
      (D.pwa.abriendo ? '<span class="girador"></span>' : ic("entrar")) + "Abrir la aplicación</button></div></div>";
  }

  /* El navegador ofreció instalarla: un toque y sale su diálogo. */
  if(D.pwa.instalable){
    return '<div class="vent vent--angosta">' + cab("Llévate el mostrador", "Instálalo en este aparato, es un toque") +
      '<div class="vent__cuerpo"><div class="centrado">' + logoImg("2.2rem") + "</div>" + bien +
      '<p class="nota-pie">No ocupa casi nada y no hace falta tienda de aplicaciones: la instala el propio navegador.</p>' +
      '</div><div class="vent__pie"><button class="btn btn--fantasma" data-a="cerrarVentana">Ahora no</button>' +
      '<button class="btn btn--sol" style="margin-left:auto" data-a="instalar">' + ic("descargar") + "Instalar ahora</button></div></div>";
  }

  /* Ni instalada ni ofrecida: iPhone, Firefox y demás. Se explica. */
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent || "");
  return '<div class="vent vent--angosta">' + cab("Llévate el mostrador", "Queda con su icono, como una aplicación") +
    '<div class="vent__cuerpo"><div class="centrado">' + logoImg("2.2rem") + "</div>" + bien +
    '<div class="aviso"><span class="aviso__ic">' + ic("info") + "</span><div>" +

    "</p></div></div>" +
    '</div><div class="vent__pie"><button class="btn btn--sol" style="margin-left:auto" data-a="cerrarVentana">Entendido</button></div></div>';
}

/* ═══ APLICACIÓN INSTALABLE ═══
   El manifiesto y los iconos viajan dentro del propio archivo.
   El trabajador de servicio —lo que la deja abrir sin internet tras
   recargar— tiene que ser un archivo servido desde tu dominio: se
   intenta registrar ./sw.js y, si no está, no pasa nada.        */
const MANIFIESTO = {
  name: "HAYAI Mostrador",
  short_name: "HAYAI",
  description: "Punto de venta y encargos para la panadería.",
  display: "standalone",
  orientation: "any",
  lang: "es-VE",
  dir: "ltr",
  background_color: "#16110B",
  theme_color: "#EF9D25",
  categories: ["business", "productivity"],
  prefer_related_applications: false,
  /* Con esto la propia página puede preguntarle al navegador si ya está
     instalada, y abrirla con un protocolo propio cuando lo está. */
  launch_handler: { client_mode: "focus-existing" }
};
const PROTOCOLO = "web+hayai";
let pedirInstalar = null;   // la oferta de instalar que da el navegador
let regSW = null;           // el trabajador de servicio registrado
let swEsperando = null;     // la versión nueva, lista y esperando permiso
let yaRecargue = false;

/* ── El manifiesto ─────────────────────────────────────────────────
   El bueno es el de al lado (manifest.webmanifest): apunta a archivos
   de verdad y ningún navegador lo discute. Si no se subió, o si el HTML
   se abrió suelto, se arma uno al vuelo con el icono que ya viaja
   dentro y con la dirección exacta de esta página. */
function manifiestoIncrustado(){
  const aqui    = location.href.split("#")[0].split("?")[0];
  const carpeta = aqui.replace(/[^/]*$/, "");
  const man = Object.assign({}, MANIFIESTO, {
    id: aqui, start_url: aqui, scope: carpeta,
    protocol_handlers: [{ protocol: PROTOCOLO, url: aqui + "?abrir=%s" }],
    icons: [
      { src: ICONO, sizes:"1024x1024", type:"image/png", purpose:"any" },
      { src: ICONO, sizes:"1024x1024", type:"image/png", purpose:"maskable" }
    ]
  });
  const viejo = document.querySelector('link[rel="manifest"]');
  if(viejo && viejo.remove) viejo.remove();
  const l = document.createElement("link");
  l.rel  = "manifest";
  l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(man));
  document.head.appendChild(l);
}

function revisarManifiesto(){
  try{
    const l = document.querySelector('link[rel="manifest"]');
    if(!l){ manifiestoIncrustado(); return; }
    fetch(l.href, { cache:"no-store" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error("no está")))
      .then(man => {
        /* Tiene que abrir ESTA página. Si apunta a otra parte, la
           aplicación instalada arrancaría en el sitio equivocado. */
        const arranque = new URL(man.start_url || ".", l.href).href;
        if(arranque !== location.href.split("#")[0].split("?")[0])
          throw new Error("apunta a otra parte");
      })
      .catch(() => manifiestoIncrustado());
  }catch(_){ try{ manifiestoIncrustado(); }catch(__){ } }
}

/* ── ¿Ya está instalada? ───────────────────────────────────────────
   Tres maneras, de la más segura a la más humilde: estar corriendo como
   aplicación, preguntárselo al navegador, o acordarnos de haberla
   instalado en este aparato. */
function recordarPuesta(si){
  try{
    if(si) localStorage.setItem("hayai-instalada", "si");
    else   localStorage.removeItem("hayai-instalada");
  }catch(_){ }
}
function seRecuerdaPuesta(){
  try{ return localStorage.getItem("hayai-instalada") === "si"; }catch(_){ return false; }
}
function estaPuesta(){
  return new Promise(ok => {
    if(D.pwa.instalada){ ok(true); return; }
    if(!navigator.getInstalledRelatedApps){ ok(seRecuerdaPuesta()); return; }
    try{
      navigator.getInstalledRelatedApps().then(
        lista => ok((lista && lista.length > 0) || seRecuerdaPuesta()),
        ()    => ok(seRecuerdaPuesta())
      );
    }catch(_){ ok(seRecuerdaPuesta()); }
  });
}

/* ── La puerta ─────────────────────────────────────────────────────
   Lo primero que ve quien abre el enlace. No se puede instalar sola —
   ningún navegador deja instalar sin que la persona toque un botón—,
   así que se le pone el botón delante y ya. */
function abrirPuerta(){
  if(D.pwa.instalada) return;              // ya estamos dentro de la aplicación
  if(D.pwa.puertaVista) return;            // en esta visita ya se preguntó
  /* Metida dentro de otra página no hay nada que instalar ni adónde
     saltar: ningún navegador deja instalar desde un marco. */
  try{ if(window.top !== window.self) return; }catch(_){ return; }
  estaPuesta().then(puesta => {
    D.pwa.puesta = puesta;
    if(D.pwa.instalada || D.ventana) return;
    D.pwa.puertaVista = true;
    D.ventana = { v: "puerta" };
    render();
  });
}

/* Abrir la aplicación instalada desde el navegador solo es posible por el
   protocolo que ella misma registró al instalarse. Se intenta en una
   pestaña aparte: si nadie lo atiende, esta página no se pierde. */
function abrirLaApp(){
  D.pwa.abriendo = true; D.pwa.noAbrio = false; render();
  let salio = false;
  const alEsconderse = () => { salio = true; };
  document.addEventListener("visibilitychange", alEsconderse, { once:true });
  let v = null;
  try{ v = window.open(PROTOCOLO + ":abrir", "_blank"); }catch(_){ }
  setTimeout(() => {
    document.removeEventListener("visibilitychange", alEsconderse);
    D.pwa.abriendo = false;
    if(!salio){ D.pwa.noAbrio = true; render(); }
    try{ if(v && !v.closed) v.close(); }catch(_){ }
  }, 1600);
}

function prepararPWA(){
  revisarManifiesto();

  D.pwa.instalada = !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
                    window.navigator.standalone === true;

  try{
  if(navigator.serviceWorker && String(location.protocol).indexOf("http") === 0){
    /* La primera vez que se abre no hay nadie al mando: cuando el
       trabajador nuevo lo tome, es la instalación, no una versión nueva. */
    const habiaMando = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("./sw.js").then(
      reg => { D.pwa.sw = true; vigilarVersiones(reg); render(); },
      () => { D.pwa.sw = false; }
    );
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      /* Si el relevo lo pedimos nosotros, se recarga y listo. Si entró
         por su cuenta, no se le recarga la pantalla a nadie encima de
         una venta: se pregunta, como todo lo demás. */
      if(D.pwa.recargando){ recargar(); return; }
      if(habiaMando) hayVersionNueva(null);
    });
  }
  }catch(_){ D.pwa.sw = false; }   // sitios aislados: sin trabajador y sin ruido

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    pedirInstalar = e;
    D.pwa.instalable = true;
    render();
  });
  window.addEventListener("appinstalled", () => {
    D.pwa.instalable = false; D.pwa.puesta = true; pedirInstalar = null;
    D.ventana = null;
    recordarPuesta(true);
    render();
    avisar("Instalada", "Ya está en la pantalla de inicio. Ábrela desde su icono.");
  });

  /* Se busca versión nueva al volver a la pantalla, cuando vuelve el
     internet y cada media hora. Así nadie se queda atrás sin enterarse. */
  document.addEventListener("visibilitychange", () => { if(!document.hidden) buscarVersion(false); });
  window.addEventListener("online", () => buscarVersion(false));
  setInterval(() => buscarVersion(false), 30 * 60 * 1000);
}

/* ── Versiones ─────────────────────────────────────────────────────
   El navegador se baja el sw.js nuevo por su cuenta y lo deja esperando.
   Aquí nos enteramos de eso y se lo decimos a la persona; el relevo solo
   ocurre cuando ella dice que sí. */
function vigilarVersiones(reg){
  regSW = reg;
  if(reg.waiting && navigator.serviceWorker.controller) hayVersionNueva(reg.waiting);
  reg.addEventListener("updatefound", () => {
    const nuevo = reg.installing;
    if(!nuevo) return;
    nuevo.addEventListener("statechange", () => {
      if(nuevo.state === "installed" && navigator.serviceWorker.controller)
        hayVersionNueva(reg.waiting || nuevo);
    });
  });
  buscarVersion(false);
}

function buscarVersion(aMano){
  if(!regSW){
    if(aMano) avisar("No se puede revisar aquí", "Hace falta el archivo sw.js en el servidor.", "mal");
    return;
  }
  if(navigator.onLine === false){
    if(aMano) avisar("Sin internet", "Vuelve a intentarlo cuando haya conexión.", "mal");
    return;
  }
  D.pwa.buscando = true;
  if(aMano) render();
  regSW.update().then(
    () => {
      D.pwa.buscando = false;
      if(!aMano) return;
      render();
      if(!D.pwa.nueva) avisar("Está al día", "No hay nada más nuevo: esta es la v" + D.version + ".");
    },
    () => {
      D.pwa.buscando = false;
      if(!aMano) return;
      render();
      avisar("No se pudo revisar", "Vuelve a intentarlo con internet.", "mal");
    }
  );
}

function hayVersionNueva(sw){
  swEsperando = sw || (regSW && regSW.waiting) || null;
  const primera = !D.pwa.nueva;
  D.pwa.nueva = true;
  D.pwa.buscando = false;
  preguntarVersion(swEsperando).then(v => {
    if(v && v !== D.pwa.versionNueva){ D.pwa.versionNueva = v; render(); }
  });
  if(primera){
    if(!D.ventana) D.ventana = { v:"actualizar" };
    avisar("Hay una versión nueva", "Ya está descargada. Actualiza cuando termines.");
    /* Si la dejan para después, se vuelve a preguntar cada diez minutos,
       pero nunca encima de otra ventana abierta. */
    setInterval(() => {
      if(D.pwa.nueva && !D.pwa.recargando && !D.ventana){ D.ventana = { v:"actualizar" }; render(); }
    }, 10 * 60 * 1000);
  }
  render();
}

/* Se le pregunta al trabajador nuevo qué versión trae, para poder
   decirla con número y no como "una nueva". */
function preguntarVersion(sw){
  return new Promise(ok => {
    if(!sw || typeof MessageChannel !== "function"){ ok(""); return; }
    try{
      const c = new MessageChannel();
      const t = setTimeout(() => ok(""), 1500);
      c.port1.onmessage = e => { clearTimeout(t); ok(String(e.data || "")); };
      sw.postMessage({ tipo:"QUE_VERSION" }, [c.port2]);
    }catch(_){ ok(""); }
  });
}

function recargar(){
  if(yaRecargue) return;
  yaRecargue = true;
  try{ location.reload(); }catch(_){ }
}

function temaEfectivo(){
  if(D.ajustes.tema !== "auto") return D.ajustes.tema;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function aplicarTema(){
  if(D.ajustes.tema === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", D.ajustes.tema);
  /* la barra del navegador y la del sistema siguen al tema */
  const m = document.getElementById("meta-tema");
  if(m) m.setAttribute("content", temaEfectivo() === "dark" ? "#16110B" : "#FFFFFF");
}
function aplicarLetra(){
  const tel = window.matchMedia("(max-width: 820px)").matches;
  const v = tel ? D.ajustes.letraTel : D.ajustes.letraPc;
  const t = { pequena:"compacto", mediana:"", grande:"grande" }[v];
  if(t) document.documentElement.setAttribute("data-tam", t);
  else document.documentElement.removeAttribute("data-tam");
}
function restaurarFoco(){
  if(!D.foco) return;
  const el = document.getElementById(D.foco);
  D.foco = null;
  if(!el) return;
  el.focus();
  try{ if(el.setSelectionRange && el.type !== "time" && el.type !== "date") el.setSelectionRange(el.value.length, el.value.length); }catch(_){}
}
const VISTAS = { inicio:vistaInicio, venta:vistaVenta, pedidos:vistaPedidos, inventario:vistaInventario,
  clientes:vistaClientes, facturacion:vistaFacturacion, cierre:vistaCierre, usuarios:vistaUsuarios,
  ajustes:vistaAjustes, montar:vistaMontar };

function render(){
  aplicarTema();
  aplicarLetra();
  const app = $("#app");
  if(!D.usuario){
    app.innerHTML = vistaEntrar();
    pintarCapa();
    if(!D.foco) D.foco = "usuario";
    restaurarFoco();
    guardar();
    return;
  }
  app.innerHTML = '<div class="app">' + barraNueva() + cabecera() +
    '<div class="cuerpo">' + VISTAS[D.pantalla]() + "</div>" +
    banda() + botonVolver() + "</div>";
  pintarCapa();
  pintarTour();
  restaurarFoco();
  guardar();
}


/* ═══════════════════════════════════════════════════════════════
   SESIÓN GUIADA
   Se oscurece la pantalla, se recorta lo que se está explicando
   y el globo lo cuenta al lado. Un paso a la vez.
   ═══════════════════════════════════════════════════════════════ */
function pasosTour(){
  const p = PANTALLAS[D.pantalla];
  if(!p || !p.guia) return [];
  return typeof p.guia === "function" ? p.guia() : p.guia;
}

function pintarTour(){
  const zona = $("#tour");
  if(!zona) return;
  const pasos = pasosTour();
  const paso = (D.tour === null || D.tour === undefined || !D.usuario) ? null : pasos[D.tour];
  if(!paso){ D.tour = null; zona.classList.add("oculto"); zona.innerHTML = ""; return; }
  const ultimo = D.tour === pasos.length - 1;
  zona.classList.remove("oculto");
  zona.innerHTML =
    '<div class="tour__hueco" id="tour-hueco"></div>' +
    '<div class="tour__globo" id="tour-globo">' +
      '<p class="tour__n">Paso ' + (D.tour + 1) + " de " + pasos.length + "</p>" +
      '<p class="tour__t">' + esc(paso.t) + "</p>" +
      '<p class="tour__d">' + esc(paso.d) + "</p>" +
      '<div class="tour__acc">' +
        '<span class="tour__puntos">' + pasos.map((_, i) =>
          '<i class="' + (i === D.tour ? "es-aqui" : "") + '"></i>').join("") + "</span>" +
        (D.tour > 0
          ? '<button class="btn btn--contorno" data-a="tourIr" data-v="' + (D.tour - 1) + '">Atrás</button>'
          : '<button class="btn btn--fantasma" data-a="tourFin">Salir</button>') +
        '<button class="btn btn--sol" data-a="' + (ultimo ? "tourFin" : "tourIr") +
          '" data-v="' + (D.tour + 1) + '">' + (ultimo ? "Entendido" : "Siguiente") + "</button>" +
      "</div></div>";
  colocarTour(paso);
}

function colocarTour(paso){
  const hueco = document.getElementById("tour-hueco");
  const globo = document.getElementById("tour-globo");
  if(!hueco || !globo) return;
  const el = paso.q ? document.querySelector('[data-tour="' + paso.q + '"]') : null;
  if(!el || !el.getBoundingClientRect){
    hueco.style.display = "none";
    globo.style.transform = "translate(-50%,-50%)";
    globo.style.left = "50%"; globo.style.top = "50%";
    return;
  }
  hueco.style.display = "block";
  globo.style.transform = "none";
  let r = el.getBoundingClientRect();
  if(r.top < 70 || r.bottom > window.innerHeight - 70){
    try{ el.scrollIntoView({ block: "center" }); }catch(_){ }
    r = el.getBoundingClientRect();
  }
  const m = 8;
  hueco.style.left   = (r.left - m) + "px";
  hueco.style.top    = (r.top - m) + "px";
  hueco.style.width  = (r.width + m * 2) + "px";
  hueco.style.height = (r.height + m * 2) + "px";

  const gw = globo.offsetWidth || 380, gh = globo.offsetHeight || 210;
  let top = r.bottom + 16, left = r.left;
  if(top + gh > window.innerHeight - 12) top = r.top - gh - 16;      // no cabe abajo: va arriba
  if(top < 12) top = Math.max(12, window.innerHeight - gh - 12);      // tampoco arriba: se pega abajo
  if(left + gw > window.innerWidth - 12) left = window.innerWidth - gw - 12;
  if(left < 12) left = 12;
  globo.style.left = left + "px";
  globo.style.top  = top + "px";
}

/* ═══════════════════════════════════════════════════════════════
   LA TASA DEL BCV
   Se trae al abrir y cada media hora. Si la fuente no contesta se
   queda la última conocida y la banda lo dice: el mostrador no para.
   Lo ya cobrado no se recalcula nunca: cada documento guarda la suya.
   ═══════════════════════════════════════════════════════════════ */
async function traerUna(cual){
  const f = FUENTE_TASA[cual];
  const r = await fetch(f.url, { cache:"no-store" });
  if(!r.ok) throw new Error("El servidor contestó " + r.status);
  const j = await r.json();
  const v = f.leer(j);
  if(!isFinite(v) || v <= 0) throw new Error("La fuente devolvió un valor que no sirve");
  return { valor:v, cuando: f.cuando(j) ? new Date(f.cuando(j)) : new Date() };
}

async function cargarTasaBCV(aMano){
  D.tasaEstado = "cargando"; D.tasaError = "";
  render();
  try{
    const oficial = await traerUna("oficial");
    D.tasas.oficial = oficial.valor;
    D.tasaFecha = oficial.cuando;
    D.tasaEstado = "ok";
    try{ D.tasas.mercado = (await traerUna("mercado")).valor; }catch(_){ /* la de mercado es secundaria */ }
    /* El euro solo se pisa si nadie lo escribió a mano: el número de
       alguien siempre vale más que una cuenta nuestra. */
    if(!D.euroAMano){
      try{
        const dolaresPorEuro = await traerEuro();
        D.tasas.euro = oficial.valor * dolaresPorEuro;
        D.euroCalculado = true;
      }catch(_){ /* sin euro: se queda como estaba y se escribe a mano */ }
    }
    anotar("Cargó la tasa del BCV desde " + FUENTE_TASA.nombre + ": " + num(oficial.valor, 4));
    render();
    if(aMano) avisar("Tasa actualizada", "BCV " + num(oficial.valor, 4) + " bolívares por dólar.");
  }catch(e){
    D.tasaEstado = "fallo";
    D.tasaError = (e && e.message) ? e.message : "No hubo respuesta";
    render();
    if(aMano) avisar("No se pudo traer la tasa",
      "Se sigue usando " + num(D.tasas.oficial, 4) + ". Puedes escribirla a mano en Ajustes.", "mal");
  }
}

function irA(p){
  if(!puedeVer(p)){
    avisar("Esa pantalla no es para tu rol",
      (ROLES[D.usuario.rol] ? ROLES[D.usuario.rol].nombre : "Tu rol") + " no entra a " +
      (PANTALLAS[p] ? PANTALLAS[p].n : p) + ". La dueña lo cambia en Usuarios.", "mal");
    return;
  }
  D.pantalla = p;
  D.ventana = null;
  D.tour = null;
  if(p === "venta") D.foco = "q-venta";
  if(p === "pedidos") D.foco = null;
  render();
}
function abrirVenta(v, ds){
  D.ventana = Object.assign({ v:v }, ds || {});
  render();
}
function lineaVenta(id){ return D.venta.find(l => l.prodId === id); }

function agregarProducto(id){
  const p = D.productos.find(x => x.id === id);
  if(!p) return;
  const l = lineaVenta(id);
  const yaEnTicket = l ? l.cant : 0;
  if(libre(p) - yaEnTicket <= 0){ avisar("No queda " + p.nombre, "Solo hay " + libre(p) + " libres y ya están en el ticket.", "mal"); return; }
  if(l) l.cant++; else D.venta.push({ prodId:id, cant:1 });
  D.ventaPanelAbierto = true;
}
function agregarPrimero(){
  const q = D.q.venta.trim().toLowerCase();
  if(!q) return;
  const p = buscarProductos(q)[0];
  if(!p){ avisar("Nada se llama «" + D.q.venta + "»", "Créalo con el botón de abajo.", "mal"); return; }
  agregarProducto(p.id);
  D.q.venta = ""; D.foco = "q-venta";
  render();
}
function bAgregarPrimero(){
  const q = D.borrador.q.trim().toLowerCase();
  if(q.length < MIN_BUSQUEDA) return;
  const p = buscarProductos(q)[0];
  if(!p) return;
  bAgregar(p.id);
  D.borrador.q = ""; D.foco = "q-borrador";
  render();
}
function bAgregar(id){
  const p = D.productos.find(x => x.id === id);
  const l = D.borrador.lineas.find(x => x.prodId === id);
  if(l) l.cant++; else D.borrador.lineas.push({ prodId:id, nombre:p.nombre, precio:p.precio, cant:1 });
}

function nuevoDocumento(cliente, pago, lineas, total, pedidoId){
  const d = { id: ++D.seqDoc, hora:new Date(), cliente, pago, lineas, total,
              tasa: D.tasas.oficial, tasaTipo:"oficial", anulado:false, pedidoId: pedidoId || null };
  D.documentos.unshift(d);
  return d;
}
function descontar(lineas){
  lineas.forEach(l => {
    const p = D.productos.find(x => x.id === l.prodId);
    if(p){ p.disponible = Math.max(0, p.disponible - l.cant); p.vendidas += l.cant; }
  });
}

  cobrarPedido(ds){
    const p = D.pedidos.find(x => x.id === Number(ds.id));
    const falta = saldoPedido(p);
    const forma = formasPago().find(f => f.id === D.cobro.pago);
    const enUsd = D.cobro.pago === "efectivo_usd";
    const recibeBs = enUsd ? D.cobro.recibe * D.tasas.oficial : D.cobro.recibe;
    if(recibeBs <= 0){ avisar("No escribiste cuánto recibes", "Pon el monto o toca «Exacto».", "mal"); return; }

    if(recibeBs < falta){                       // abono, no cobro completo
      p.abonado += recibeBs;
      const d = nuevoDocumento(nombreCliente(p), forma.nombre + " (abono)",
        [{ nombre:"Abono al pedido " + p.id, precio:recibeBs, cant:1 }], recibeBs, p.id);

    }

    const vuelto = recibeBs - falta;
    descontar(p.lineas);
    p.abonado = totalPedido(p);
    p.estado = "cobrado";
    recalcularComprometido();
    const d = nuevoDocumento(nombreCliente(p), forma.nombre, p.lineas.map(l =>
      ({ prodId:l.prodId, nombre:nombreDe(l), precio:precioDe(l), cant:l.cant })), totalPedido(p), p.id);
    anotar("Cobró el pedido " + p.id + " · " + bs(falta));
    D.ventana = { v:"ticket", id:d.id }; D.cobro = null; render();
    avisar("Cobrado · pedido " + p.id, vuelto > 0 ? "Vuelto " + bs(vuelto) + ", siempre en bolívares." : forma.nombre + ".");

    /* El rol nuevo trae sus permisos: lo ajustado a mano se descarta,
       que si no nadie entendería por qué quedó a medio camino. */
    delete u.permisos;
    anotar("Cambió el rol de " + u.nombre + " a " + ROLES[u.rol].nombre);
    render();
  },
  permiso(ds){
    const u = D.usuarios.find(x => x.id === Number(ds.id));
    if(!u) return;
    if(D.usuario && u.id === D.usuario.id){
      avisar("Tus propios permisos no", "Que te los cambie otra persona: si no, alguien se deja afuera solo.", "mal");
      return;
    }
    if(!u.permisos) u.permisos = Object.assign({}, permisosDe(u));
    if(u.permisos[ds.m] === ds.v) return;
    u.permisos[ds.m] = ds.v;
    const comoSeLee = { no:"no entra", ver:"solo mira", todo:"entra y cambia" }[ds.v];
    anotar("Permisos de " + u.nombre + ": " + PANTALLAS[ds.m].n + ", " + comoSeLee);
    render();
  },
  guardarUsuario(){
    const nombre = ($("#us-nombre").value || "").trim();
    const usuario = ($("#us-usuario").value || "").trim();
    if(!nombre || !usuario){ avisar("Faltan el nombre y el usuario", "Son los dos únicos datos que hacen falta.", "mal"); return; }
    const rol = (document.querySelector('input[name="rol"]:checked') || { value:"cajero" }).value;
    D.usuarios.push({ id: Date.now(), nombre, usuario, clave: $("#us-clave").value || "1234", rol,
      iniciales: nombre.split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase() });
    /* Sin permisos propios: hereda los del rol hasta que alguien los toque. */
    anotar("Agregó a " + nombre + " como " + ROLES[rol].nombre);
    D.ventana = null; render();
    avisar("Agregado", nombre + " ya puede entrar como " + ROLES[rol].nombre.toLowerCase() + ".");
  },
  acercaTab(ds){ D.ventana.tab = ds.v; render(); },

  /* Montar pedido */
  bAgregar(ds){ bAgregar(Number(ds.id)); fijarAbono(D.borrador.abono); render(); },
  bMenos(ds){
    const l = D.borrador.lineas.find(x => x.prodId === Number(ds.id));
    if(!l) return;
    l.cant--;
    if(l.cant <= 0) D.borrador.lineas = D.borrador.lineas.filter(x => x.prodId !== l.prodId);
    fijarAbono(D.borrador.abono);
    render();
  },
  bCanal(ds){ D.borrador.canal = ds.v; render(); },
  bAbonoRapido(ds){ fijarAbono(ds.v); render(); },
  limpiarBorrador(){ D.borrador.q = ""; D.foco = "q-borrador"; render(); },
  bDia(ds, el){
    if(el.value === "otro"){
      D.borrador.dia = "otro";
      if(!D.borrador.fecha) D.borrador.fecha = iso(hoyMas(1, 0, 0));
    } else D.borrador.dia = Number(el.value);
    render();
  },
  bFecha(ds, el){ D.borrador.fecha = el.value; D.foco = el.id; render(); },
  bHora(ds, el){ D.borrador.hora = el.value; D.foco = el.id; render(); },
  bAbono(ds, el){ fijarAbono(el.value); D.foco = el.id; render(); },
  bNota(ds, el){ D.borrador.nota = el.value; },
  bCliente(ds){ D.borrador.clienteId = ds.id ? Number(ds.id) : null; D.borrador.qCliente = ""; render(); },
  bNuevoCliente(){ D.q.clientes = D.borrador.qCliente; D.ventana = { v:"cliente", volver:"pedido" }; render(); },
  bGuardar(){
    const b = D.borrador;
    if(!b.lineas.length){ avisar("El pedido está vacío", "Vuelve al paso 1 y pon al menos un producto.", "mal"); return; }
    const p = { id: ++D.seqPedido, clienteId:b.clienteId, lineas:b.lineas.map(l => ({ prodId:l.prodId, nombre:l.nombre, precio:l.precio, cant:l.cant })),
      abonado: Math.min(b.abono, totalBorrador()), estado:"por_cobrar", retiro: fechaRetiro(),
      canal: b.canal, nota: b.nota, tasa: D.tasas.oficial, tasaTipo:"oficial" };
    D.pedidos.unshift(p);
    recalcularComprometido();
    anotar("Montó el pedido " + p.id + " · " + bs(totalPedido(p)) + (p.abonado ? " · abonó " + bs(p.abonado) : ""));
    D.borrador = null; D.borradorVolver = null; D.destino = null;
    D.ventana = null; D.pantalla = "pedidos"; D.pedidoAbierto = p.id;
    render();
    avisar("Pedido " + p.id + " guardado",
      "Se apartaron las unidades. Queda debiendo " + bs(saldoPedido(p)) + ".");
  },

  /* Calculadora */
  calcMonto(ds, el){ D.calc.monto = aNumero(el.value); D.foco = el.id; render(); },
  calcMoneda(ds){ D.calc.moneda = ds.v; render(); }
};

/* Cada acción que cambia algo pertenece a una pantalla. Las que solo
   miran —buscar, filtrar, imprimir, cambiar el tema— no están aquí:
   ver nunca se le niega a quien ya entró. */
const ACCION_MODULO = {
  agregar:"venta", menos:"venta", pago:"venta", limpiarVenta:"venta",
  cobrarVenta:"venta", otraVenta:"venta", cobrarPedido:"venta", cobroPago:"venta",
  cobroRecibe:"venta", cobroMonto:"venta",

  montar:"pedidos", cancelarMontar:"pedidos", dejarPedido:"pedidos", entregar:"pedidos",
  anularPedido:"pedidos", bAgregar:"pedidos", bMenos:"pedidos", bCanal:"pedidos",
  bAbonoRapido:"pedidos", limpiarBorrador:"pedidos", bDia:"pedidos", bFecha:"pedidos",
  bHora:"pedidos", bAbono:"pedidos", bNota:"pedidos", bCliente:"pedidos", bGuardar:"pedidos",

  moverExistencia:"inventario", crearProducto:"inventario",

  guardarCliente:"clientes", completarCliente:"clientes", bNuevoCliente:"clientes",

  anularDoc:"facturacion",

  cerrarCaja:"cierre", confirmarCierre:"cierre",

  rol:"usuarios", guardarUsuario:"usuarios", permiso:"usuarios",

  guardarTasas:"ajustes", tasaPref:"ajustes", efectivo:"ajustes", moneda:"ajustes", conexion:"ajustes"
};

function hacer(a, ds, el, e){
  const mod = ACCION_MODULO[a];
  if(mod && D.usuario && !puedeEditar(mod)){
    avisar("Eso no lo puedes cambiar tú",
      (ROLES[D.usuario.rol] ? ROLES[D.usuario.rol].nombre : "Tu rol") + " entra a " +
      (PANTALLAS[mod] ? PANTALLAS[mod].n : mod) + " a mirar, no a cambiar.", "mal");
    return;
  }
  const f = ACCIONES[a];
  if(f) f(ds || {}, el, e);
}

/* ═══════════════════════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  if(el.matches("input, select, textarea")) return;
  e.preventDefault();
  hacer(el.dataset.a, el.dataset, el, e);
});
document.addEventListener("input", e => {
  const el = e.target;
  if(!el.dataset) return;
  if(el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio") return;
  if(el.dataset.in){
    const k = el.dataset.in;
    D.foco = el.id;
    if(k === "borrador") D.borrador.q = el.value;
    else if(k === "bcliente") D.borrador.qCliente = el.value;
    else D.q[k] = el.value;
    render();
    return;
  }
  if(el.dataset.a) hacer(el.dataset.a, el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if(!el.dataset || !el.dataset.a) return;
  if(el.tagName === "SELECT" || el.type === "checkbox" || el.type === "radio") hacer(el.dataset.a, el.dataset, el, e);
});
$("#capa").addEventListener("mousedown", e => { if(e.target.id === "capa") cerrarVentana(); });

document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(D.tour !== null) hacer("tourFin", {}); else if(D.ventana) cerrarVentana(); return; }
  if(D.tour !== null && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    e.preventDefault();
    const n = D.tour + (e.key === "ArrowRight" ? 1 : -1);
    if(n < 0) return;
    if(n >= pasosTour().length) hacer("tourFin", {}); else hacer("tourIr", { v:String(n) });
    return;
  }
  const dentro = e.target.matches && e.target.matches("input, textarea, select");
  if(dentro){
    if(e.key === "Enter"){
      if(e.target.id === "q-venta"){ e.preventDefault(); agregarPrimero(); }
      else if(e.target.id === "q-borrador"){ e.preventDefault(); bAgregarPrimero(); }
      else if(e.target.id === "clave" || e.target.id === "usuario"){ e.preventDefault(); hacer("entrar", {}); }
    }
    return;
  }
  if(!D.usuario || e.ctrlKey || e.altKey || e.metaKey) return;
  const k = e.key;
  const buscadores = { venta:"q-venta", pedidos:"q-pedidos", inventario:"q-inventario", clientes:"q-clientes" };
  if(k === "?"){ e.preventDefault(); abrirVenta("atajos"); return; }
  if(k === "/"){
    const id = buscadores[D.pantalla];
    if(id && document.getElementById(id)){ e.preventDefault(); document.getElementById(id).focus(); }
    return;
  }
  if(k === "+" || k === "-" || k === "="){
    if(D.pantalla === "venta" && D.venta.length){
      e.preventDefault();
      const ultima = D.venta[D.venta.length - 1];
      if(k === "-") hacer("menos", { id:String(ultima.prodId) });
      else hacer("agregar", { id:String(ultima.prodId) });
    }
    return;
  }
  const b = k.toLowerCase();
  if(b === "v"){ e.preventDefault(); irA("venta"); return; }
  if(b === "p"){ e.preventDefault(); hacer("montar", {}); return; }
  if(b === "t"){ e.preventDefault(); abrirVenta("tasas"); return; }
  if(k >= "1" && k <= "7"){ e.preventDefault(); irA(ORDEN[Number(k) - 1]); }
});

window.addEventListener("resize", () => {
  aplicarLetra();
  if(document.activeElement && document.activeElement.matches && document.activeElement.matches("input, textarea, select")) return;
  render();
});

/* El reloj de la banda y el saludo de Inicio se refrescan solos */
setInterval(() => {
  if(!D.usuario || D.ventana) return;
  if(document.activeElement && document.activeElement.matches && document.activeElement.matches("input, textarea, select")) return;
  render();
}, 30000);

/* La tasa se vuelve a traer cada media hora */
setInterval(() => { if(D.usuario && D.enLinea) cargarTasaBCV(false); }, 30 * 60 * 1000);

/* ── El idioma, dicho en voz alta ──────────────────────────────────
   El sistema está en español de Venezuela. Sin decirlo, el navegador lo
   adivina y termina ofreciendo traducirlo —o traduciéndolo solo, si
   alguien aceptó una vez—. Con esto se queda como está escrito. */
function fijarIdioma(){
  const h = document.documentElement;
  if(!h) return;
  h.lang = "es-VE";
  h.setAttribute("translate", "no");
  if(h.classList) h.classList.add("notranslate");
}

/* ── Arranque ──────────────────────────────────────────────────── */
fijarIdioma();
/* Si hay algo guardado en este aparato, eso manda. Los datos de ejemplo
   solo se siembran la primera vez, o cuando alguien decide empezar de
   cero desde Ajustes. */
if(!cargar()) sembrar();
prepararPWA();
render();
cargarTasaBCV(false);
/* Se le da un momento al navegador para que diga si la puede instalar,
   y ahí mismo se abre la puerta: instalarla, o saltar a la instalada. */
setTimeout(abrirPuerta, 900);

/* Al cerrar la pestaña o mandarla al fondo no se espera al temporizador:
   se escribe de una, que es justo cuando el navegador puede descartarla. */
window.addEventListener("pagehide", guardarYa);
document.addEventListener("visibilitychange", () => { if(document.hidden) guardarYa(); });
</script>
